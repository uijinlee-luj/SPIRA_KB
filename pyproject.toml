[project]
name = "spira-kb"
version = "0.1.0"
description = "Synthetic purchase-intent knowledge base pipeline for SPIRA"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "typer>=0.12",
  "pydantic>=2",
]

[project.optional-dependencies]
# 코드 단계 (GitHub Actions에서만 필요). 노트북에는 설치하지 않아도 된다.
pipeline = [
  "polars>=1",
  "duckdb>=1",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.5",
  "FlagEmbedding>=1.2",      # BGE-M3
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]
dev = ["pytest>=8"]

[project.scripts]
spira = "spira.runner:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spira"]
