# 현황 갱신: data/ · config/가 바뀔 때마다 요약(status.json)을 만들어 status 브랜치에 올린다.
# main에는 커밋하지 않는다 (노트북들의 push와 부딪히지 않게).
name: status
on:
  push:
    branches: [main]
    paths: ["data/**", "config/**", "spira/status.py", ".github/workflows/status.yml"]
  workflow_dispatch:
concurrency:
  group: status
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m spira.status > "$RUNNER_TEMP/status.json"
      - name: status 브랜치에 올리기
        run: |
          mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          cp ../status.json .
          git init -q -b status
          git add status.json
          git -c user.name="spira-status" -c user.email="actions@users.noreply.github.com" commit -qm "현황 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" status
