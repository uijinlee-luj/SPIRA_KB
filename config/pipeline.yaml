# 파이프라인 숫자 (지식 베이스 설계 5 · 7절). 품질 관문 결과를 보고 U가 고친다.
# 코드는 이 파일만 읽는다. 바꾸면 다음에 만드는 배치부터 적용된다.

version: 1

cases_per_batch: 1000          # 조각(배치) 하나 = 품질 관문 1배치 (config/cycles의 cases_per_slice와 같게)
cases_per_job: 50              # 작업 하나 = 사례 50개 (생성 · 라벨 공통)
checks_per_label_job: 3        # 라벨 작업마다 섞는 확인용 사례

# 5-2 주문 유형 비율 (합 1.0)
order_types: { A: 0.45, B: 0.25, W: 0.10, E: 0.05, C: 0.05, D: 0.10 }

# 주문 하나의 상품 수: 2~10개, 중앙값 6개
order_size: { min: 2, max: 10, weights: { 2: 3, 3: 6, 4: 10, 5: 14, 6: 16, 7: 14, 8: 10, 9: 6, 10: 4 } }
everyday_added: { B: [1, 3], E: [0, 2], C: [0, 1], D: [0, 2] }   # 묶음에 더하는 평소 물건 개수 범위
weak_bundle_items: [1, 2]       # W 유형: 묶음에서 가져오는 물건 수
boundary_items: [1, 2]          # E 유형: 헷갈리는 다른 의도 묶음에서 가져오는 물건 수
random_items: [2, 5]            # D 유형: 특정 용도 물건을 무작위로

# 5-3 맥락
household_hidden: 0.20          # 저장할 때 가구 정보를 숨기는 비율
calendar_tag_count: { 0: 0.55, 1: 0.25, 2: 0.13, 3: 0.07 }
related_event_share: 0.15       # 전체 사례 중 "관련 있는 일정"을 붙이는 비율
unrelated_event_vs_everyday: 0.5   # 관련 없는 일정 중 행사 태그 비율 (나머지는 일상 태그)
calendar_days: [-1, 14]         # 도착일 기준 일정 날짜 범위

# 7 품질 관문
gate:
  none_ratio: [0.60, 0.75]
  calendar_shortcut_max: 0.05
  label_agreement: [0.85, 0.97]
  b_recall_min: 0.85
  w_seen: [0.30, 0.70]
  per_intent_min_ratio: 0.5     # 기대 개수 대비
  review_wrong_max: 0.20

review:
  per_batch: 30                 # 배치마다 사람 검수 사례 수
  mix: { agree: 0.5, disagree: 0.3, weak: 0.2 }
  people: [U, Y, S, J]          # 배치 30개를 이 사람들에게 나눠 준다

dedup_similarity: 0.97          # 같은 의도 + 물건 임베딩 코사인 유사도 이상이면 하나로 (KB-07)

# 2-2 사이클 B 종료 규칙 (가): 끝나는 날까지 이만큼 날이 남지 않았으면 새 회차를 시작하지 않는다.
# 첫 회차가 끝나면 실제 걸린 날 수로 바꾼다.
min_days_for_new_round: 3
