# 사이클 A — 계속 돈다
cycle: A
active: true
ends_on: null            # 끝나는 날 없음

# 회사별 담당 계정 (회사가 다른 세 모델이어야 한다)
members:
  gemini: { person: Y, tool: antigravity }
  codex:  { person: J, tool: codex }
  claude: { person: S, tool: claude_code }

# 역할 돌리기: 묶음을 만든 회사는 자기 조각에 라벨을 달지 않는다
slices:
  "1-1": { generate: gemini, label_1: codex,  label_2: claude }
  "1-2": { generate: codex,  label_1: claude, label_2: gemini }
  "1-3": { generate: claude, label_1: gemini, label_2: codex }

cases_per_slice: 1000    # 조각 하나 = 품질 관문 1배치
