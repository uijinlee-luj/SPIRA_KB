# 사이클 B — 2026-11-18에 끝난다
cycle: B
active: true
ends_on: 2026-11-18      # 이 날부터 active를 false로 바꾼다 (코드는 그대로)

# 종료 규칙: ends_on 전에 한 사이클을 다 끝내지 못할 것 같으면
# B의 새 사이클은 시작하지 않는다. (사이클 소요 시간은 첫 사이클에서 측정)
no_new_cycle_if_unfinishable: true

members:
  gemini: { person: U, tool: antigravity }
  codex:  { person: Y, tool: codex }
  claude: { person: J, tool: claude_code }

# 역할 돌리기: 묶음을 만든 회사는 자기 조각에 라벨을 달지 않는다
# 배치 이름 = {사이클}{회차}-{조각}  예) B1-1, B1-2, B1-3, B2-1 …
slices:
  "1": { generate: gemini, label_1: codex,  label_2: claude }
  "2": { generate: codex,  label_1: claude, label_2: gemini }
  "3": { generate: claude, label_1: gemini, label_2: codex }

cases_per_slice: 1000    # 조각 하나 = 품질 관문 1배치

# 회사별로 고정해서 쓰는 모델 (KB-12). 실제로 쓰인 모델은 작업 결과마다 따로 기록한다.
# TODO(측정 후): 각자 계정에서 쓸 수 있는 모델로 확정
models:
  gemini: gemini-3.8-flash-high   # Antigravity `agy models` 이름 (Flash, High)
  codex:  null   # 예) gpt-5.x-codex
  claude: null   # 예) claude-opus-5-5
