# 캘린더 태그 (30개)와 동의어 사전 — 지식 베이스 설계 4-2절
# 서버는 사용자의 캘린더 제목을 이 동의어 사전으로 태그로 바꾸고, 제목은 저장하지 않는다.
# - 동의어 하나는 태그 하나에만 속한다. 애매한 제목에는 태그를 붙이지 않는다.
# - 일상 태그 5개는 어떤 의도와도 이어지지 않는다.
# - 건강 관련 일정이 기록되지 않도록 병원 일정은 태그로 두지 않는다.
#
# TODO(U): 동의어 채우기. 지금은 설계 문서의 예시만 들어 있다.

version: 1

groups:
  기념일·행사: [생일, 기념일, 설날, 추석, 크리스마스, 연말 모임, 어린이날, 어버이날, 졸업식]
  모임·손님: [집들이, 손님 방문, 가족 모임, 친구 모임, 경기 관람]
  외출·여행: [여행, 출장, 캠핑, 나들이·소풍]
  생활·학교: [이사, 입학·개학, 방학, 시험, 김장, 대청소, 반려동물 입양]
  일상: [회의, 약속·외식, 운동, 학원·수업, 공연·영화]

# 일상 태그: "관련 없는 일정"의 절반을 여기서 뽑는다 (설계 5-3절)
everyday_group: 일상

synonyms:
  생일: [생신, 생파]
  회의: [미팅]
